name: Build metrics

# Manual only: there is deliberately no push, pull_request or schedule trigger.
# Re-scores ParseBench 2 pipelines from their published outputs with a pinned ParseBench
# commit (plus full_events.patch) against pinned ground truth, a few pipelines per job (in parallel on the
# runner), and uploads <pipeline>.jsonl.gz / .next_score.json / .manifest.json as one artifact per job
# (metrics-batch-<n>, kept 30 days). The dataset build itself runs on the maintainer's machine.

on:
  workflow_dispatch:
    inputs:
      pipelines:
        description: Comma-separated pipeline names from pipelines.json (empty = all)
        type: string
        default: ""
      scorer_commit:
        description: run-llama/ParseBench commit to score with
        type: string
        default: d6209dab930702c63f6dcf23eca02501a948d76b
      data_revision:
        description: llamaindex/ParseBench-2 (ground truth) commit
        type: string
        default: 2e95407575ba1ad6aa90842258482a561fae1b33
      per_job:
        description: Pipelines scored side by side on one runner
        type: number
        default: 2
      leaderboard_commit:
        description: run-llama/ParseBench commit whose leaderboard-v2.csv the scores must match (empty = skip the check)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Select pipelines
        id: matrix
        env:
          ONLY: ${{ inputs.pipelines }}
          PER_JOB: ${{ inputs.per_job }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, os
          rows = json.load(open("pipelines.json"))
          only = [p.strip() for p in os.environ["ONLY"].split(",") if p.strip()]
          unknown = sorted(set(only) - {r["pipeline"] for r in rows})
          if unknown:
              raise SystemExit(f"not in pipelines.json: {unknown}")
          if only:
              rows = [r for r in rows if r["pipeline"] in only]
          k = max(1, int(float(os.environ["PER_JOB"] or 1)))
          batches = [rows[i:i + k] for i in range(0, len(rows), k)]
          print("matrix=" + json.dumps({"include": [
              {"batch": n + 1, "names": ", ".join(r["pipeline"] for r in b), "rows": json.dumps(b)}
              for n, b in enumerate(batches)]}))
          EOF

      # Fetch the ground truth once and share it through the cache, so the matrix jobs
      # do not all hit the Hub with ~9,000 file downloads at the same time.
      - id: gt-cache
        uses: actions/cache@v4
        with:
          path: gt
          key: parsebench2-gt-${{ inputs.data_revision }}
          lookup-only: true

      - if: steps.gt-cache.outputs.cache-hit != 'true'
        name: Download ground truth
        env:
          DATA_REV: ${{ inputs.data_revision }}
        run: |
          pip install --quiet "huggingface_hub>=0.34"
          python3 - <<'EOF'
          import os, time
          from huggingface_hub import snapshot_download
          for i in range(6):
              try:
                  snapshot_download("llamaindex/ParseBench-2", repo_type="dataset",
                                    revision=os.environ["DATA_REV"], local_dir="gt", max_workers=4)
                  break
              except Exception as e:
                  if i == 5:
                      raise
                  print("retry", i, repr(e)[:200], flush=True)
                  time.sleep(15 * 2 ** i)
          EOF
          rm -rf gt/.cache

      - if: steps.gt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: gt
          key: parsebench2-gt-${{ inputs.data_revision }}

  score:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    name: score ${{ matrix.batch }} (${{ matrix.names }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: run-llama/ParseBench
          ref: ${{ inputs.scorer_commit }}
          path: scorer

      # full_events.patch: uncapped event lists (scores unchanged).
      # register_pipelines.patch: ParseBench's own registration of pipelines published after the scorer
      # commit (parse.py only), emptied once upstream registers them itself. The layout evaluator picks its
      # adapter from this registry, so an unregistered pipeline falls back to a heuristic adapter and can score
      # differently. Scoring code is untouched.
      - name: Apply patches
        run: |
          for p in full_events.patch register_pipelines.patch; do
            echo "$p sha256: $(sha256sum $p | cut -d' ' -f1)"
            # a patch upstream has since covered is emptied (no diff) and skipped
            if grep -q '^diff --git' "$GITHUB_WORKSPACE/$p"; then git -C scorer apply "$GITHUB_WORKSPACE/$p"; else echo "skipped $p (empty)"; fi
          done
          git -C scorer diff --stat

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Layout adapters import provider SDKs (llama_cloud and others), so the evaluator needs the
      # runners extra, as in ParseBench's own leaderboard workflows.
      - name: Install scorer
        run: uv sync --project scorer --frozen --extra runners --extra fast

      - uses: actions/cache/restore@v4
        with:
          path: gt
          key: parsebench2-gt-${{ inputs.data_revision }}
          fail-on-cache-miss: true

      # The pipelines of this batch run side by side, each with its own work dir and log.
      - name: Score
        env:
          ROWS: ${{ matrix.rows }}
          SCORER_COMMIT: ${{ inputs.scorer_commit }}
          DATA_REV: ${{ inputs.data_revision }}
        run: |
          PATCH_SHA=$(sha256sum full_events.patch | cut -d' ' -f1)
          REG_SHA=$(sha256sum register_pipelines.patch | cut -d' ' -f1)
          pids=()
          while IFS=$'\t' read -r provider pipeline rev; do
            ( uv run --project scorer --no-sync python run_pipeline.py \
                --provider "$provider" --pipeline "$pipeline" --results-revision "$rev" \
                --gt-dir gt --work "work/$pipeline" --out deliver \
                --scorer-commit "$SCORER_COMMIT" --data-revision "$DATA_REV" \
                --patch-sha256 "$PATCH_SHA" --register-patch-sha256 "$REG_SHA" > "log-$pipeline.txt" 2>&1 ) &
            pids+=("$!:$pipeline")
          done < <(python3 -c 'import json, os; [print(r["provider"], r["pipeline"], r["results_revision"], sep="\t") for r in json.loads(os.environ["ROWS"])]')
          fail=0
          for x in "${pids[@]}"; do
            if wait "${x%%:*}"; then echo "== ${x#*:}: ok"; else echo "== ${x#*:}: FAILED"; fail=1; fi
            echo "::group::log ${x#*:}"; cat "log-${x#*:}.txt"; echo "::endgroup::"
          done
          exit $fail

      - if: always()  # keep a batch partner's results when the other pipeline fails
        uses: actions/upload-artifact@v4
        with:
          name: metrics-batch-${{ matrix.batch }}
          path: deliver/
          retention-days: 30

  # One summary for the whole run: every pipeline's six dimensions against leaderboard-v2.csv at
  # leaderboard_commit (compare_scores.py, the same check the runbook runs locally). It reads only the small
  # next_score.json files, so a mismatch shows here before anyone downloads the deliverables.
  check:
    needs: score
    if: ${{ always() && inputs.leaderboard_commit != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: metrics-batch-*
          path: deliver

      - name: Compare with the leaderboard
        env:
          LB_COMMIT: ${{ inputs.leaderboard_commit }}
          ONLY: ${{ inputs.pipelines }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/run-llama/ParseBench/$LB_COMMIT/leaderboard-v2.csv" -o leaderboard-v2.csv
          python3 - <<'EOF'
          import json, os
          rows = json.load(open("pipelines.json"))
          only = [p.strip() for p in os.environ["ONLY"].split(",") if p.strip()]
          json.dump([r for r in rows if not only or r["pipeline"] in only], open("selected.json", "w"))
          EOF
          set +e
          python3 viewer/compare_scores.py deliver leaderboard-v2.csv selected.json | tee compare.txt
          rc=${PIPESTATUS[0]}
          { echo "### Scores vs leaderboard-v2.csv @ ${LB_COMMIT:0:7}"; echo '```'; cat compare.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
